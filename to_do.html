
<!DOCTYPE html>
<html>
<head>
    <title>To Do List</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #eaf2ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            font-size: 25px;
            color: #1e293b;
            text-align: center;
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input[type="text"] {
            flex: 1;
            padding: 11px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 14px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #3b82f6;
        }

        .add-btn {
            padding: 10px 16px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .add-btn:hover {
            background-color: #2563eb;
        }

        .list-title {
            font-size: 18px;
            color: #334155;
            margin-bottom: 15px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 10px;
            text-align: left;
        }

        #list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #list > div {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            background-color: #f8fafc;
            padding: 13px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        #list h3 {
            flex: 1;
            font-size: 14px;
            color: #334155;
            font-weight: 500;
            word-break: break-word;
        }

        #list button {
            padding: 7px 12px;
            border: none;
            border-radius: 5px;
            font-size: 12px;
            cursor: pointer;
            color: white;
            transition: opacity 0.2s;
        }

        #list button:hover {
            opacity: 0.8;
        }

        #list button:nth-of-type(1) {
            background-color: #10b981;
        }

        #list button:nth-of-type(2) {
            background-color: #ef4444;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>To Do List</h1>

        <div class="input-group">
            <input type="text" id="input" placeholder="Enter a task...">
            <button class="add-btn" onclick="createtask()">Add Task</button>
        </div>

        <h2 class="list-title">Task List</h2>

        <div id="list"></div>

    </div>

    <script>

        let id = 0;

        function createtask()
        {
            let task = document.getElementById("input").value;

            if(task == "")
            {
                alert("Enter the task");
                return;
            }

            id++;

            document.getElementById("list").innerHTML +=
            `<div id="task${id}">
                <h3>${task}</h3>
                <button onclick="complete(${id})">Complete</button>
                <button onclick="deletetask(${id})">Delete</button>
            </div>`;

            document.getElementById("input").value = "";
        }

        function deletetask(id)
        {
            document.getElementById("task" + id).remove();
        }

        function complete(id)
        {
            document.getElementById("task" + id).style.textDecoration = "line-through";
        }

    </script>

</body>
</html>
